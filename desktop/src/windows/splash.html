<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lawmate</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #151312;
    color: #f5f4f2;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid rgba(245, 244, 242, 0.25);
    border-top-color: #f5f4f2;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { font-size: 14px; letter-spacing: 0.02em; opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="label" id="label">Starting Lawmate…</div>
  </div>
</body>
</html>
