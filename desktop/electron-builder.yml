appId: com.lawmate.desktop
productName: Lawmate
directories:
  output: dist
  buildResources: build

# No custom icon.ico shipped yet — electron-builder falls back to its own
# default icon. Drop a real one at build/icon.ico and add `icon: build/icon.ico`
# under `win:` before distributing to real clients.

files:
  - dist-src/**/*.js
  - dist-src/windows/*.html
  - shared/**/*.json

extraResources:
  - from: resources/python
    to: python
  - from: resources/postgres
    to: postgres
    filter:
      - "**/*"
      - "!share/locale/**"
      - "!share/man/**"
      - "!doc/**"
      - "!symbols/**"
      # GUI/dev-only tooling the app never launches — pgAdmin 4 alone bundles
      # a whole separate Python environment duplicating packages the app's
      # own backend/resources/python already has.
      - "!pgAdmin 4/**"
      - "!StackBuilder/**"
      - "!include/**"
  - from: resources/node
    to: node
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: resources/frontend
    to: frontend
  # Optional — only present for developer-local builds with Google OAuth
  # credentials configured (see desktop/.env.desktop). Filter matches
  # nothing (no error) when the file wasn't staged.
  - from: resources
    to: .
    filter:
      - ".env.desktop"

win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: "Lawmate-Setup-${version}.exe"
